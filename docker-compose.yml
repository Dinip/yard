# Runs the published images from GHCR. `VERSION_TAG` pins the version — `latest`
# tracks releases, `edge` the tip of main, or a `1.2.3` for a fixed one.
#
# To build the images from this checkout instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build

name: yard

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yard}
      POSTGRES_DB: ${POSTGRES_DB:-yard}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yard} -d ${POSTGRES_DB:-yard}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  coordinator:
    image: ghcr.io/dinip/yard/coordinator:${VERSION_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-yard}:${POSTGRES_PASSWORD:-yard}@postgres:5432/${POSTGRES_DB:-yard}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      WEB_ORIGIN: ${WEB_ORIGIN:-${PUBLIC_URL}}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      ENABLE_EMAIL_PASSWORD: ${ENABLE_EMAIL_PASSWORD:-false}
      SESSION_TOKEN_PRIVATE_KEY: ${SESSION_TOKEN_PRIVATE_KEY:-}
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ghcr.io/dinip/yard/web:${VERSION_TAG:-latest}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Wait for what it proxies to: Caddy starting first turns a slow migration
    # into 502s that look like a broken deploy.
    depends_on:
      coordinator:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      # Set to the public hostname for automatic HTTPS, or leave as :80 for local.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # Probes the admin API: a hostname SITE_ADDRESS makes 127.0.0.1 match no site.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Needs host device access, so it is opt-in:
  #   docker compose --profile provider up
  #
  # Shaped for Linux, where the devices are. The whole /dev/bus/usb *directory*
  # goes in, not individual --device nodes — a phone that reboots re-enumerates
  # under a new node and a static binding silently loses it. The container
  # starts both an adb server and a usbmuxd of its own, so the host must run
  # neither — only one process may own a device. Mask the host's usbmuxd with
  # `systemctl mask --now usbmuxd.service`, and drop the `adb_server` option
  # from provider.yaml, since the container is no longer borrowing the host's.
  #
  # macOS: Docker cannot pass USB through at all, so comment the mount and
  # `privileged` out and reach the host's daemons instead — see
  # docker-compose.macos.yml, which is what this repo's own testing uses.
  provider:
    profiles: ["provider"]
    image: ghcr.io/dinip/yard/provider:${VERSION_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${PROVIDER_PORT:-7100}:7100"
      # Remote debugging draws from this range; keep it and remote_debug.ports
      # in provider.yaml in step.
      - "${DEBUG_PORTS:-7200-7249}:${DEBUG_PORTS:-7200-7249}"
    environment:
      PROVIDER_TOKEN: ${PROVIDER_TOKEN:?issue one under /admin/providers}
      PROVIDER_LOG_LEVEL: ${PROVIDER_LOG_LEVEL:-info}
      # The entrypoint starts an adb server and a usbmuxd whenever /dev/bus/usb
      # is mounted. Turn one off to split a host into a provider per platform 
      # See docs/PROVIDER.md.
      PROVIDER_START_ADB: ${PROVIDER_START_ADB:-auto}
      PROVIDER_START_USBMUXD: ${PROVIDER_START_USBMUXD:-auto}
    volumes:
      - ./packages/provider/provider.yaml:/etc/yard/provider.yaml:ro
      # adb's keypair. Not a cache: the phone's "Allow USB debugging" grant is
      # bound to this key's fingerprint, so a container that regenerates it on
      # recreate has to be re-authorised by hand, at the device, every time.
      - adb-keys:/root/.android
      # The iOS developer disk image, downloaded once. A volume rather than a
      # tmpfs so a container recreate does not re-fetch it — and so it can be
      # pre-populated from Xcode's copy to keep the download off a mirror.
      - ddi-cache:/var/lib/yard/ddi
      # usbmuxd's half of the same problem: /var/lib/lockdown holds the host
      # identity it pairs under and one pair record per device. Lose it and
      # every iPhone in the rack asks to Trust This Computer again, by hand.
      - lockdown-keys:/var/lib/lockdown
      # Comment this out on macOS: the path does not exist to bind.
      - /dev/bus/usb:/dev/bus/usb
    # Access to the /dev/bus/usb nodes, which are root-owned — the permission,
    # not the devices. See docs/PROVIDER.md.
    privileged: true
    tmpfs:
      # Staged APK/IPA uploads only. Nothing here outlives an install.
      - /var/lib/yard/scratch:size=4g

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  adb-keys:
  ddi-cache:
  lockdown-keys:
