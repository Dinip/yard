# Development overlay: `docker compose -f docker-compose.dev.yml up`
# Brings up only the stateful dependency. The coordinator and web run on the
# host with `bun run dev` so both hot-reload.
#
# Prometheus and Grafana sit behind the `observability` profile, so the default
# `up` is still one container: nothing in the test suite needs them, and every
# developer running the DB tests would otherwise pay for two more.
#
#   docker compose -f docker-compose.dev.yml --profile observability up -d
#
# then Grafana on :3001 (anonymous admin), scraping a provider on the host at
# :9100 — which needs `metrics:` enabled in provider.yaml.
name: device-farm-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: farm
      POSTGRES_PASSWORD: farm
      POSTGRES_DB: farm
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm -d farm"]
      interval: 5s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.6.0
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docs/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-dev-data:/prometheus
    extra_hosts:
      # Providers are not part of this stack — they run on the host in dev and
      # on other machines in production — so the scrape target is the host.
      - "host.docker.internal:host-gateway"

  # Deliberately stateless: the datasource and the dashboard are both
  # provisioned from files, so there is nothing here worth keeping. A volume
  # would only preserve a *stale* copy of them — a datasource provisioned once
  # without a uid then refuses to be re-provisioned with one, and Grafana
  # crash-loops on "data source not found" until the volume is removed.
  grafana:
    image: grafana/grafana:12.2.0
    profiles: [observability]
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      # Dev only, and the reason this is not in docker-compose.yml.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Nothing here needs them, and they fail their signature check and slow
      # every start by re-downloading.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "3001:3000"
    volumes:
      - ./docs/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docs/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres-dev-data:
  prometheus-dev-data:
