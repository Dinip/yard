# yard-provider configuration.
#
#   yard-provider --config provider.yaml
#   yard-provider --config provider.yaml --check   # validate and exit
#
# One process supervises every device on this host. Replaces
# stf-ios-provider's one-container-per-device model.

# Must match the provider registered under /admin/providers in the coordinator.
id: lab-1
name: Lab 1

coordinator_url: https://yard.example.com

# The URL the BROWSER uses to reach this provider directly, for video and
# uploads. The coordinator never connects to it — providers dial out.
#
# Must be HTTPS anywhere but localhost: WebCodecs refuses to run outside a
# secure context, and the failure looks like a blank screen with no error.
public_base_url: https://lab-1.example.com

# Where the session and artifact planes listen. Put a TLS terminator in front.
bind: 0.0.0.0:7100

# Staged uploads land here and are deleted after every install, successful or
# not. A tmpfs is a good choice — nothing here is meant to survive.
scratch_dir: /var/lib/yard/scratch
# Durable copies and desired-state manifest for admin preloads. Keep this on
# storage that survives provider restarts; it is intentionally separate from
# scratch_dir, which can be a tmpfs.
preload_dir: /var/lib/yard/preloads
max_upload_mb: 2048

# Ports `adb connect` reaches an exposed device on. A device claims one while it
# is being debugged and gives it back on release, so the range caps how many can
# be debugged at once — not how many devices this provider has. Publish the same
# range from whatever runs the provider.
remote_debug:
  ports: 7200-7249

# The iOS Developer Disk Image, which the provider mounts for itself.
#
# An iPhone loses the mount on every reboot, and without one it offers no screen,
# no input and no app list — only lockdown. Absent block means ON, the opposite
# of `metrics:` above: devices nobody has to touch after a reboot is the point.
#
# One image serves every iOS 17+ device; what makes it device-specific is a
# ticket signed by Apple during the mount. So it is downloaded once per host.
# Pre-populate cache_dir — with a copy from Xcode's iOS_DDI.dmg or your own
# mirror — and nothing is ever fetched from a third party. Note that the *first*
# mount of a given device still reaches gs.apple.com for its ticket, whatever
# the cache holds.
ddi:
  enabled: true
  # Holds Image.dmg, BuildManifest.plist and Image.dmg.trustcache. Not under
  # scratch_dir on purpose: that is meant to be a tmpfs, this is meant to last.
  cache_dir: /var/lib/yard/ddi
  base_url: https://raw.githubusercontent.com/doronz88/DeveloperDiskImage/main/PersonalizedImages/Xcode_iOS_DDI_Personalized

# Turn an idle device's screen off until somebody reserves it, and wake it back
# to a home screen when they do. On by default; a shelf of phones rendering
# their lock screens all day is heat nobody asked for, and iOS gets warm enough
# to matter. Set false for a wall meant to stay visibly lit.
blank_idle_screens: true

# Prometheus metrics. Optional — an absent block means off, but writing the block
# and omitting `enabled` means on, because writing it at all is the intent.
#
# A listener of its own rather than a route on `bind`: that port is browser-facing,
# carries a CORS layer and session tokens, and a scraper has neither. There is no
# auth here on purpose — bind it to an interface only your monitoring can reach.
metrics:
  enabled: true
  bind: 0.0.0.0:9100
  # How often every device is sampled. The exporter serves a cache, so a scrape
  # never waits on a phone and a second scraper cannot double the load.
  interval_secs: 30
  # Per-app CPU and memory, Android only. Globbed against the *process* name, so
  # a leaked `com.foo.bar:push` stays distinct from `com.foo.bar`. Matching
  # everything is refused at load: it would mint a series per process per device.
  # This pattern matches exactly one of the two apps the mock Android device
  # reports, so the filter is visible in a scrape without any hardware.
  app_patterns:
    - "*.demo.*"

# Prefer PROVIDER_TOKEN or token_file over an inline token.
# Precedence: env var > token_file > token.
#   token: pft_...
#   token_file: /run/secrets/yard-provider-token

devices:
  # Synthetic devices. No hardware required — this is how the provider is
  # developed and tested, and how you can exercise the whole UI end to end.
  - udid: mock-ios-1
    backend: mock
    name: Mock iPhone
    options:
      platform: ios

  - udid: mock-android-1
    backend: mock
    name: Mock Pixel
    options:
      platform: android
    # Emptied when a reservation ends, if the farm's cleanup policy has
    # "Empty scratch folders" on — see /admin/settings and docs/CLEANUP.md.
    #
    # Set here rather than in the coordinator on purpose: these end in a
    # recursive delete on a phone, and no web form should. Anything under
    # /system, /boot, /proc, /vendor, /dev or /sys is refused at startup, so a
    # typo fails here rather than on a device. Absent means the step does
    # nothing for this device.
    cleanup_paths:
      - /sdcard/Download

  # Real devices:
  #
  # - udid: 00008120-000C1D2E3F401234   # iOS 27+
  #   backend: ios
  #   name: iPhone 15 Pro
  #   options:
  #     display_id: 0                     # 0 is the built-in screen
  #     motion_idr: true                  # undo iOS motion resolution-collapse
  #     # Mount the Developer Disk Image for this device. Set false to leave it
  #     # to whoever runs the host — after every reboot, because the mount does
  #     # not survive one. See the `ddi:` block above.
  #     auto_mount_ddi: true              # default
  #
  # - udid: R5CT10ABCDE                 # adb serial
  #   backend: android
  #   name: Pixel 8
  #   options:
  #     # Where the adb server is. It owns the USB transport, so it must run on
  #     # the host the phones are plugged into. On Linux that is this image,
  #     # with /dev/bus/usb mounted in; on macOS, where Docker cannot pass USB
  #     # through, point at the host's server instead.
  #     adb_server: 127.0.0.1:5037        # default
  #     # Encode settings. The default caps the long edge at 1280 — a phone's
  #     # native panel is far more than a browser window shows, and every extra
  #     # pixel is bandwidth and encode latency.
  #     max_size: 1280
  #     bit_rate: 8000000
  #     max_fps: 60
