<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Device Farm</title>
    <!--
      Applies the theme before first paint. next-themes sets the same class, but
      only once React has mounted, which is long enough to flash a white page at
      a dark-theme user on every load. Keep the storage key in step with the
      ThemeProvider in src/routes/__root.tsx.
    -->
    <script>
      (() => {
        const stored = localStorage.getItem("theme");
        const dark =
          stored === "dark" ||
          ((!stored || stored === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
