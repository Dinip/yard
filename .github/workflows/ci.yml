# What has to hold before main moves.
#
# The Rust and TypeScript halves are separate jobs because they fail for
# unrelated reasons and waiting for the other's toolchain to install helps
# nobody.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A push that supersedes an in-flight run makes that run irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: farm
          POSTGRES_PASSWORD: farm
          POSTGRES_DB: farm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U farm -d farm"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://farm:farm@localhost:5432/farm
      PUBLIC_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:5173
      # Length is validated at boot; the value is irrelevant to a test run.
      AUTH_SECRET: ci-secret-that-is-at-least-32-characters
      ENABLE_EMAIL_PASSWORD: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run db:migrate
      - run: bun test packages/protocol packages/coordinator/test packages/web/test
      - run: cd packages/web && bun run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The wire contract is committed in two languages. This is what makes a schema
  # change that was not regenerated fail the build rather than ship a provider
  # that encodes cleanly and delivers nothing.
  protocol-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: bun install --frozen-lockfile
      # Regenerates and diffs: the generated Rust is piped through rustfmt, so
      # `cargo fmt --check` and this cannot demand different bytes.
      - run: bun run protocol:check

  # A repository name may contain capitals; a container reference may not.
  # Computed once here rather than lowercased in both jobs below.
  prepare:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      registry: ${{ steps.name.outputs.registry }}
    steps:
      - id: name
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  # Built per architecture on its own native runner, then merged into one
  # manifest list. The alternative — one job with QEMU emulation — is what this
  # used to do, and cross-building the Rust provider under emulation is slow
  # enough to dominate the whole pipeline.
  images:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [typescript, rust, prepare]
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: coordinator, dockerfile: packages/coordinator/Dockerfile }
          - { name: web, dockerfile: packages/web/Dockerfile }
          - { name: provider, dockerfile: packages/provider/Dockerfile }
        platform:
          - { arch: amd64, tag: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, tag: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.tag }}
          # Pushed without a tag: an arch-specific tag would be a lie the moment
          # the other architecture lands on it. The manifest job names them.
          outputs: type=image,name=${{ needs.prepare.outputs.registry }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          # The filename is the digest; the file itself is empty. The manifest
          # job only needs the names.
          touch "/tmp/digests/${{ steps.build.outputs.digest }}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # One manifest list per image, pointing at both architectures. Until this
  # runs the digests are pushed but unnamed, so nothing can pull them.
  manifest:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [images, prepare]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [coordinator, web, provider]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.registry }}/${{ matrix.image }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:${{ github.sha }}" \
            $(printf "$IMAGE@%s " *)

      - name: Show what was published
        env:
          IMAGE: ${{ needs.prepare.outputs.registry }}/${{ matrix.image }}
        run: docker buildx imagetools inspect "$IMAGE:latest"
