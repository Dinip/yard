# What has to hold before main moves.
#
# The Rust and TypeScript halves are separate jobs because they fail for
# unrelated reasons and waiting for the other's toolchain to install helps
# nobody.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A push that supersedes an in-flight run makes that run irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: farm
          POSTGRES_PASSWORD: farm
          POSTGRES_DB: farm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U farm -d farm"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://farm:farm@localhost:5432/farm
      PUBLIC_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:5173
      # Length is validated at boot; the value is irrelevant to a test run.
      AUTH_SECRET: ci-secret-that-is-at-least-32-characters
      ENABLE_EMAIL_PASSWORD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run db:migrate
      - run: bun test packages/protocol packages/coordinator/test packages/web/test
      - run: cd packages/web && bun run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The wire contract is committed in two languages. This is what makes a schema
  # change that was not regenerated fail the build rather than ship a provider
  # that encodes cleanly and delivers nothing.
  protocol-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: bun install --frozen-lockfile
      # Regenerates and diffs: the generated Rust is piped through rustfmt, so
      # `cargo fmt --check` and this cannot demand different bytes.
      - run: bun run protocol:check

  images:
    # Only on main: a multi-arch build is slow, and a PR that cannot build its
    # images is already failing the jobs above for the same reason.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [typescript, rust]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: coordinator
            dockerfile: packages/coordinator/Dockerfile
          - image: web
            dockerfile: packages/web/Dockerfile
          - image: provider
            dockerfile: packages/provider/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # arm64 is not optional: a provider host is often an Apple silicon
          # Mac mini or an arm board sitting next to the devices.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
