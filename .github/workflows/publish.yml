# push to main → `edge`; push of a `v*` tag → `1.2.3`, `1.2`, `latest`.
# Neither re-runs the tests: the commit already passed CI as a pull request.

name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded main build is wasted work; a superseded release build is a
  # release that silently never happened.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  images:
    uses: ./.github/workflows/docker.yml
    with:
      push: true
      arches: '["amd64","arm64"]'
