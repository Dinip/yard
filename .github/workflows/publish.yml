# The tip of main, published as `edge`. Releases are release.yml.
# Tests are not re-run: the commit already passed CI as a pull request.

name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    uses: ./.github/workflows/docker.yml
    with:
      push: true
      arches: '["amd64","arm64"]'
      tags: |
        edge
        sha-${{ github.sha }}
