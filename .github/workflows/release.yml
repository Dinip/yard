# Builds and publishes the container images. Nothing else does.
#
# Two ways to get an image, and both are deliberate acts:
#
#   release published     ghcr.io/<repo>/<image>:<version> — plus :latest unless
#                         it is a prerelease. This is what deployments track.
#   PR labelled `build`   :pr-<number>, for trying a branch on real hardware
#                         before it merges. Never moves :latest.
#
# Every build is gated on CI. A release is built from a commit CI already passed
# on main; a PR build waits for that PR's CI run to conclude successfully before
# it starts.
#
# The label is consumed: it is removed once the run finishes, so the PR ends up
# back where it started and building again is adding it again. That is also the
# only way to rebuild — `labeled` does not fire for a label already present.

name: Release

on:
  release:
    types: [published]
  pull_request:
    types: [labeled]

concurrency:
  # Keyed on what is being built, not on the run that asked for it.
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'release' && github.event.release.tag_name
      || github.event.pull_request.number
    }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Decides whether this event is a build at all, and of what. Everything
  # downstream reads its outputs and asks nothing about the event that started
  # the run.
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      sha: ${{ steps.decide.outputs.sha }}
      pr_tag: ${{ steps.decide.outputs.pr_tag }}
      # Set for any run that came from a `build` label, built or not — it is what
      # the label is removed from at the end.
      pr: ${{ steps.decide.outputs.pr }}
      repo: ${{ steps.name.outputs.repo }}
    steps:
      # A repository name may contain capitals; a container reference may not.
      - id: name
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          LABEL: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          # A fork's PR gets a read-only token, so a build could not push even if
          # we wanted it to. Refuse clearly rather than fail three jobs later.
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail

          skip() { echo "build=false" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }

          if [ "$EVENT" = "release" ]; then
            {
              echo "build=true"
              echo "sha=$RELEASE_SHA"
            } >> "$GITHUB_OUTPUT"
            echo "release $RELEASE_TAG → $RELEASE_SHA"
            exit 0
          fi

          # Any other label is not a build request.
          [ "$LABEL" = "build" ] || skip "label $LABEL is not 'build'"

          # From here the label is consumed whatever happens — the `unlabel` job
          # reads this — so asking again is always add-the-label-again.
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          [ "$SAME_REPO" = "true" ] || skip "PR #$PR_NUMBER is from a fork"

          # The label says someone wants an image; it says nothing about whether
          # the code is good. CI may still be running for this commit, or may
          # never have run. Wait rather than publish something untested.
          for _ in $(seq 1 60); do
            conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow CI --commit "$PR_SHA" --limit 1 \
              --json conclusion --jq '.[0].conclusion // "pending"')
            case "$conclusion" in
              success) break ;;
              pending|null|"") echo "CI has not concluded for $PR_SHA; waiting"; sleep 30 ;;
              *) skip "CI concluded $conclusion for $PR_SHA" ;;
            esac
          done
          [ "${conclusion:-}" = "success" ] || skip "timed out waiting for CI on $PR_SHA"

          {
            echo "build=true"
            echo "sha=$PR_SHA"
            echo "pr_tag=pr-$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUMBER → pr-$PR_NUMBER"

  # Built per architecture on its own native runner, then merged into one
  # manifest list. The alternative — one job with QEMU emulation — is what this
  # used to do, and cross-building the Rust provider under emulation is slow
  # enough to dominate the whole pipeline.
  images:
    # Without this the job name is every matrix value joined — dockerfile path,
    # platform tag and runner included.
    name: ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: coordinator, dockerfile: packages/coordinator/Dockerfile }
          - { name: web, dockerfile: packages/web/Dockerfile }
          - { name: provider, dockerfile: packages/provider/Dockerfile }
        platform:
          - { arch: amd64, tag: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, tag: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      # Explicit: a PR build must be of the head commit CI passed on, not of the
      # merge ref, which is a commit that will never exist again.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the labels are used here — the tags are named by the manifest job.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.repo }}/${{ matrix.image.name }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pushed without a tag: an arch-specific tag would be a lie the moment
          # the other architecture lands on it. The manifest job names them.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.resolve.outputs.repo }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          # Registry cache rather than GHA's: builds are rare now that a merge
          # publishes nothing, and GitHub evicts its cache per branch and by age
          # — which is exactly the cache a release would want and never find.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ needs.resolve.outputs.repo }}/${{ matrix.image.name }}:buildcache-${{ matrix.platform.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ needs.resolve.outputs.repo }}/${{ matrix.image.name }}:buildcache-${{ matrix.platform.arch }},mode=max

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          # The filename is the digest with its `sha256:` prefix stripped, and
          # the file itself is empty — the manifest job only needs the names.
          # The prefix has to go: an artifact path may not contain a colon.
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # One manifest list per image, pointing at both architectures. Until this
  # runs the digests are pushed but unnamed, so nothing can pull them.
  manifest:
    name: manifest (${{ matrix.image }})
    needs: [images, resolve]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [coordinator, web, provider]
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag policy, in one place:
      #   release      the version, and the commit sha
      #   prerelease   the same, but `latest=auto` withholds :latest
      #   PR build     pr-<number> only
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.repo }}/${{ matrix.image }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ needs.resolve.outputs.sha }},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ needs.resolve.outputs.pr_tag }},enable=${{ needs.resolve.outputs.pr_tag != '' }}

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Create the manifest list
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.repo }}/${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          # metadata-action emits one tag per line.
          names=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then names+=("$tag"); fi
          done <<< "$TAGS"
          [ ${#names[@]} -gt 0 ] || { echo "no tags resolved"; exit 1; }

          args=()
          for name in "${names[@]}"; do args+=(--tag "$name"); done

          images=()
          for digest in /tmp/digests/*; do
            images+=("$IMAGE@sha256:$(basename "$digest")")
          done

          docker buildx imagetools create "${args[@]}" "${images[@]}"
          docker buildx imagetools inspect "${names[0]}"

  # The label is a request, and a request is consumed. Removing it is also what
  # makes "build it again" a gesture that exists: `labeled` does not fire for a
  # label that is already there, so leaving it on would mean a second build of
  # the same PR could never be asked for.
  #
  # `always()`: removed whether the build succeeded, failed, or never started
  # because CI was red. A label left behind after a red build is one nobody can
  # re-apply.
  unlabel:
    needs: [resolve, manifest]
    if: always() && needs.resolve.outputs.pr != ''
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.resolve.outputs.pr }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label build
