# YARD Drop is checked on its own, because a Flutter toolchain has nothing to
# do with the Bun and Cargo jobs and neither should wait on the other.

name: Flutter

on:
  pull_request:
    paths:
      - "apps/yard_drop/**"
      - ".github/workflows/flutter.yml"
  push:
    branches: [main]
    paths:
      - "apps/yard_drop/**"
      - ".github/workflows/flutter.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/yard_drop

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  # The share receiver only exists on a device: content URIs, MediaStore and a
  # stream that dies partway have no JVM stand-in. API 29 is the floor the app
  # supports, API 35 is what the farm handsets run.
  instrumentation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.6
          channel: stable
          cache: true
      - run: flutter pub get
      # The Gradle test task needs the Flutter assets a debug build produces.
      - run: flutter build apk --debug
      - name: Allow the runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          # Staging a 64 MB share needs more room than the default image has.
          disk-size: 4096M
          working-directory: apps/yard_drop/android
          script: ./gradlew :app:connectedDebugAndroidTest
