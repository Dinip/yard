# YARD Drop is checked on its own, because a Flutter toolchain has nothing to
# do with the Bun and Cargo jobs and neither should wait on the other.

name: Flutter

on:
  pull_request:
    paths:
      - "apps/yard_drop/**"
      - ".github/workflows/flutter.yml"
  push:
    branches: [main]
    paths:
      - "apps/yard_drop/**"
      - ".github/workflows/flutter.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/yard_drop

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
