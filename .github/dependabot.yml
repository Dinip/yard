version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

updates:
  - package-ecosystem: bun
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: pub
    directory: /apps/yard_drop
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: docker
    directories:
      - /packages/coordinator
      - /packages/provider
      - /packages/usbmuxd
      - /packages/web
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: docker-compose
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
