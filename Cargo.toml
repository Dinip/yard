[workspace]
resolver = "2"
members = ["packages/provider/crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
yard-protocol = { path = "packages/provider/crates/yard-protocol" }
adb-bridge = { path = "packages/provider/crates/adb-bridge" }
provider-core = { path = "packages/provider/crates/provider-core" }
backend-ios = { path = "packages/provider/crates/backend-ios" }
backend-android = { path = "packages/provider/crates/backend-android" }
backend-mock = { path = "packages/provider/crates/backend-mock" }

tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "net",
  "io-util",
  "fs",
  "signal",
] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
futures = "0.3"
# Streaming HTTP bodies for the fallback video path.
async-stream = "0.3"
async-trait = "0.1"

# iOS device services: lockdown, CoreDevice, RSD. Pinned exactly — upstream
# warns of breaking changes at every point release until 0.2.0
# (../idevice/README.md), and the ported device layer is written against this
# API surface.
idevice = { version = "=0.1.65", features = ["full"] }
# Lockdown and mobilegestalt answer in plists.
plist = "1"

# Session + artifact planes. `ws` for video/input, `multipart` for APK/IPA
# uploads that must stream to disk rather than buffer in memory.
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

# Control plane: one outbound WSS to the coordinator.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# `rustls-native-certs` rather than bundled webpki roots: an on-prem farm often
# terminates TLS with a private CA, and the OS trust store is where that lives.
# The runtime image must therefore include `ca-certificates`.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "rustls-native-certs",
  "json",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml is deprecated upstream; _ng is the maintained fork.
serde_yaml_ng = "0.10"

jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# ADB authentication: verify a client's PKCS#1 v1.5 signature over our challenge.
# The 0.9 line on purpose — 0.10 is still a release candidate, and this is the
# code that decides who gets a shell on a phone.
rsa = "0.9"
# Only for the SHA-1 DigestInfo prefix ADB's signatures carry. Not a hash we
# choose; it is the one `adb` has always signed with.
sha1 = { version = "0.10", features = ["oid"] }
base64 = "0.23"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
rand = "0.10"
# Glob matching for the metrics app filter. `*`/`?` only and no transitive deps;
# globset would pull regex + aho-corasick + memchr in to match a handful of names.
wildmatch = "2.6"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
